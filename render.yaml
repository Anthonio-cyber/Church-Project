# 𝒾Pastor on Render — one web service, one managed PostgreSQL database.
#
#   1. Push this repository to GitHub.
#   2. In Render: New → Blueprint, and point it at the repository.
#   3. Render creates both services and wires DATABASE_URL automatically.
#   4. Set NEXT_PUBLIC_APP_URL to your domain once it is assigned.
#
# AUTH_SECRET and DATA_ENCRYPTION_KEY are generated by Render on first deploy.
# Copy DATA_ENCRYPTION_KEY somewhere safe: losing it means losing access to
# counselling notes and safeguarding narratives permanently.

databases:
  - name: ipastor-db
    databaseName: ipastor
    plan: basic-256mb
    postgresMajorVersion: '16'

services:
  - type: web
    name: ipastor
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ipastor-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_BRAND_NAME
        value: iPastor
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUSH_NOTIFICATION_KEY
        sync: false
      - key: NODE_ENV
        value: production
