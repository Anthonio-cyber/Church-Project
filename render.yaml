# ─────────────────────────────────────────────────────────────────────────────
# 𝒾Pastor on Render — one web service, one managed PostgreSQL database.
#
# Deploying:
#   1. Push this repository to GitHub (already done).
#   2. Render dashboard → New → Blueprint → pick this repository.
#   3. Render reads this file, creates both services and wires DATABASE_URL.
#   4. Set NEXT_PUBLIC_APP_URL when prompted (it is marked sync:false below,
#      so Render asks rather than guessing).
#   5. Settings → Custom Domains → add ipastor.church and www.ipastor.church.
#
# AUTH_SECRET and DATA_ENCRYPTION_KEY are generated by Render on first deploy.
# COPY DATA_ENCRYPTION_KEY SOMEWHERE SAFE IMMEDIATELY — it encrypts counselling
# notes and safeguarding narratives, and losing it makes them unrecoverable.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: ipastor-db
    databaseName: ipastor
    user: ipastor
    plan: basic-256mb
    postgresMajorVersion: '16'
    # Render takes daily backups on paid instance types. Confirm the retention
    # period in the dashboard and test a restore before going live.

services:
  - type: web
    name: ipastor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true

    domains:
      - ipastor.church
      - www.ipastor.church

    envVars:
      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: ipastor-db
          property: connectionString

      # Generated by Render on first deploy.
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true

      # Must match the domain people actually visit — email links, the PWA
      # manifest and the same-origin check all read it.
      - key: NEXT_PUBLIC_APP_URL
        value: https://ipastor.church

      - key: NEXT_PUBLIC_BRAND_NAME
        value: iPastor

      - key: NODE_ENV
        value: production

      # Optional integrations. Set these in the Render dashboard when ready;
      # until then the platform reports them honestly as "not configured"
      # rather than pretending they work.
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: iPastor <no-reply@ipastor.church>
      # Mobile push, once the apps ship. Browser push needs only the VAPID
      # pair below, which is free and needs no third-party account.
      - key: PUSH_NOTIFICATION_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Free voice/video for counselling sessions. No account needed.
      - key: VIDEO_SERVICE_URL
        value: https://meet.jit.si
      - key: BACKUP_SCHEDULE
        sync: false
