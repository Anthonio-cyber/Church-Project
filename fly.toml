# 𝒾Pastor on Fly.io — one app, one Postgres cluster.
#
#   fly launch --no-deploy
#   fly postgres create --name ipastor-db
#   fly postgres attach ipastor-db          # sets DATABASE_URL
#   fly secrets set AUTH_SECRET="$(openssl rand -base64 48)"
#   fly secrets set DATA_ENCRYPTION_KEY="$(openssl rand -base64 48)"
#   fly secrets set NEXT_PUBLIC_APP_URL="https://your-domain.example.org"
#   fly deploy
#   fly certs add your-domain.example.org

app = "ipastor"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_PUBLIC_BRAND_NAME = "iPastor"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
